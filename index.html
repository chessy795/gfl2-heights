--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--sil:#3f4148;color-scheme:light}

--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--sil:#c9ccd6;color-scheme:dark}}
:root[data-theme="dark"]{--surface:#1a1a19;--stage:#121316;--stage-2:#1b1d22;--panel:#24252a;--text-1:#f0efec;--text-2:#c3c2b7;--text-3:#8e8d86;--grid:#24262b;--grid-2:#33363d;--axis:#45453f;--floor:#5a5d66;--glow:rgba(57,135,229,.16);
--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--sil:#c9ccd6;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--surface);color:var(--text-1);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{padding:24px 16px 40px}
.disp{font-family:Rajdhani,"Bahnschrift","Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:14px}
h1{font-size:34px;line-height:1;margin:0;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
h1 small{display:block;font-size:13px;letter-spacing:.24em;color:var(--text-3);font-weight:600;margin-bottom:6px}
.sub{color:var(--text-2);margin:8px 0 0;max-width:820px}
.bar{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--axis);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--text-2);padding:6px 12px;font:inherit;cursor:pointer}
.seg button+button{border-left:1px solid var(--axis)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--text-1);font-weight:600}
.seg.lang{align-self:flex-start;flex-wrap:wrap}.seg.lang button{padding:10px 18px;font-size:16px;white-space:nowrap}
@media (max-width:600px){.seg.lang button{padding:8px 11px;font-size:14px}h1{font-size:28px}}
label.chk{display:inline-flex;gap:6px;align-items:center;color:var(--text-2);cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--text-2);font-size:13px;margin-bottom:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.hidden{display:none!important}
/* lineup */
.stage{position:relative;border-radius:12px;overflow:hidden;background:radial-gradient(120% 80% at 50% 0%,var(--glow),transparent 60%),linear-gradient(var(--stage),var(--stage-2));border:1px solid var(--grid)}
.lscroll{overflow-x:auto;overflow-y:hidden;position:relative}
.lscroll::-webkit-scrollbar{height:10px}.lscroll::-webkit-scrollbar-thumb{background:var(--grid-2);border-radius:5px}
.track{position:relative}
.stage+.stage{margin-top:14px}
.gl{position:absolute;left:0;right:0;height:1px;background:var(--grid)}
.gl.major{background:var(--grid-2)}
.floor{position:absolute;left:0;right:0;height:2px;background:var(--floor)}
.floorfade{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--stage-2) 30%)}
.ruler{position:absolute;left:0;top:0;bottom:0;width:58px;pointer-events:none;z-index:500;background:linear-gradient(90deg,var(--stage) 55%,transparent)}
.ruler div{position:absolute;left:8px;font:600 12px/1 Rajdhani,"Bahnschrift",sans-serif;color:var(--text-3);transform:translateY(-50%);letter-spacing:.04em}
.fig{position:absolute;overflow:hidden;pointer-events:none;transition:opacity .2s,filter .2s;
 -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent),linear-gradient(#000 calc(100% - 12px),transparent);-webkit-mask-composite:source-in;
 mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent),linear-gradient(#000 calc(100% - 12px),transparent);mask-composite:intersect}
.fig.full{-webkit-mask-image:linear-gradient(#000 calc(100% - 12px),transparent);mask-image:linear-gradient(#000 calc(100% - 12px),transparent)}
.fig img,.fig svg.s{position:absolute;top:0;display:block;user-select:none}
.shd{position:absolute;height:16px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.5),transparent);transform:translate(-50%,-50%);z-index:5;pointer-events:none}
.hit{position:absolute;cursor:pointer;z-index:450}
.dim .fig{opacity:.2;filter:saturate(.25)}
.dim .fig.on{opacity:1;filter:none}
.lab{position:absolute;z-index:460;text-align:center;transform:translateX(-50%);white-space:nowrap;pointer-events:none}
.lab b{display:block;font:700 17px/1 Rajdhani,"Bahnschrift",sans-serif;color:var(--text-1);letter-spacing:.02em}
.lab span{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--text-2);margin-top:3px}
.lab i{width:7px;height:7px;border-radius:2px;display:inline-block}
.dim .lab{opacity:.35}.dim .lab.on{opacity:1}
.hline{position:absolute;left:0;right:0;height:0;border-top:1.5px dashed var(--text-2);pointer-events:none;z-index:600;display:none}
.hline span{position:absolute;left:66px;top:-22px;font:700 14px/1 Rajdhani,"Bahnschrift",sans-serif;color:var(--text-1);background:var(--panel);border:1px solid var(--axis);border-radius:6px;padding:3px 7px}
/* bars */
.wrap{display:flex;border:1px solid var(--grid);border-radius:12px;background:var(--surface)}
.wrap+.wrap{margin-top:14px}
.bkey{display:flex;align-items:center;gap:6px;color:var(--text-2);font-size:13px;margin:0 0 10px}.bkey i{width:10px;height:16px;border-radius:3px 3px 0 0;display:inline-block}
.bkey .sb{background:var(--text-3)}.bkey .db{border:1.5px dashed var(--text-3);border-bottom:0;margin-right:4px}
.yaxis{flex:0 0 44px}
.scroll{overflow-x:auto;flex:1}
svg text{font-family:inherit}
.plot .ic{transition:transform .35s cubic-bezier(.3,1.4,.5,1)}.plot .ex{opacity:0;transition:opacity .25s}
/* table */
#tbl{display:flex;gap:28px;align-items:flex-start}
#tbl table{flex:1}
table{border-collapse:collapse;margin-top:4px;font-size:13px}
th,td{padding:5px 8px;text-align:left;border-bottom:1px solid var(--grid)}
th{color:var(--text-2);font-weight:600;cursor:pointer;user-select:none}
td.n{text-align:right;font-variant-numeric:tabular-nums}
td img,td .ph{width:24px;height:24px;border-radius:50%;vertical-align:middle;margin-right:8px;display:inline-block;background:var(--grid)}
.tip{position:fixed;pointer-events:none;background:var(--panel);color:var(--text-1);border:1px solid var(--axis);border-radius:8px;padding:8px 10px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.22);display:none;z-index:9999;max-width:270px}
.tip b{display:block;font:700 17px/1.1 Rajdhani,"Bahnschrift",sans-serif;margin-bottom:3px}
.tip .m{color:var(--text-2)}
.foot{color:var(--text-3);font-size:12px;margin:22px 0 0;max-width:900px}
.notes{color:var(--text-2);font-size:13px;max-width:900px;margin-top:20px;padding-left:18px}
.notes li{margin:4px 0}
</style>
</head>

  add('floor',{top:FLOOR+'px'});add('floorfade',{top:(FLOOR+2)+'px'});
  a.forEach((d,i)=>{
    const cx=pos[i],col=`var(${FC[d.frame]})`,LH=d.lh||d.h;let dh,dw,top,node,imgL;
    if(d.sil){const s=SIL[d.sil];dh=d.h*PX;dw=dh*s.w/400;top=Y(d.h);imgL=cx-dw/2;
      node=el('svg',{class:'s',viewBox:`0 0 ${s.w} 400`,width:dw,height:dh});
      const gid='sg'+d.sil;const gr=el('linearGradient',{id:gid,x1:0,y1:0,x2:0,y2:1},el('defs',{},node));
      el('stop',{offset:0,'stop-color':css('--sil'),'stop-opacity':.95},gr);el('stop',{offset:1,'stop-color':css('--sil'),'stop-opacity':.55},gr);
      el('path',{d:s.d,fill:`url(#${gid})`,'fill-rule':'evenodd',stroke:css('--s6'),'stroke-width':400/dh*1.5,'stroke-opacity':.8},node);
    }else if(d.hd!=null){// head top (hd %) pinned to the measured height; a posed figure (sp) keeps its scale and may lift off the floor
      dh=LH*PX/((d.sp||d.ft-d.hd)/100);dw=dh*d.ar;top=Y(LH)-dh*d.hd/100;imgL=cx-(d.cx??.5)*dw;
      node=document.createElement('img');node.src='art/'+d.code+'.webp?v='+BUILD;node.alt=nm(d);node.decoding='async';node.style.width=dw+'px';node.style.height=dh+'px';
    }else return;
    const ww=d.sil?dw*2:win(d);
    const f=add('fig',{top:top+'px',height:(FLOOR+6-top)+'px',zIndex:10+i});f.appendChild(node);
    const narrow=()=>{f.classList.remove('full');f.style.left=(cx-ww/2)+'px';f.style.width=ww+'px';node.style.left=(imgL-(cx-ww/2))+'px'};
    const wide=()=>{f.classList.add('full');f.style.left=imgL+'px';f.style.width=dw+'px';node.style.left='0px'};
    narrow();
    add('shd',{left:cx+'px',top:FLOOR+'px',width:Math.min(ww*.55,d.h*PX*.3)+'px'});
    const lab=add('lab',{left:cx+'px',top:(FLOOR+10)+'px'},`<b>${d.h.toFixed(1)}</b><span><i style="background:${col}"></i>${nm(d)}</span>`);
    const sw=step(d),hit=add('hit',{left:(cx-sw/2)+'px',width:sw+'px',top:(Y(LH)-14)+'px',height:(FLOOR-Y(LH)+14+LAB)+'px'});
    hit.addEventListener('mouseenter',()=>{wide();stage.classList.add('dim');f.classList.add('on');lab.classList.add('on');f.style.zIndex=400;
      hl.style.display='block';hl.style.top=Y(LH)+'px';hl.querySelector('span').textContent=`${nm(d)}  ${LH.toFixed(1)} cm${d.lt?' '+S().lt[d.lt]:''}`});
    hit.addEventListener('mousemove',e=>tip(e,d));
    hit.addEventListener('mouseleave',()=>{narrow();stage.classList.remove('dim');f.classList.remove('on');lab.classList.remove('on');f.style.zIndex=10+i;hl.style.display='none';hideTip()});
  });
}
}

/* ---------- bars ---------- */
const CV=document.createElement('canvas').getContext('2d');
const tw=(t,fs)=>{CV.font=`${fs}px ${getComputedStyle(document.body).fontFamily}`;return CV.measureText(t).width};// rendered width in px
function nameLines(N,max=COL-2){// one line if it fits (shrinking a little), else two lines split at a space or middle dot, else mid-word
  const fit=(L,lo)=>{const w=Math.max(...L.map(t=>tw(t,11)));const fs=Math.min(11,11*max/w);return fs>=lo?{lines:L,fs:Math.floor(fs*10)/10}:null};
  let r=fit([N],10);if(r)return r;
  let best=null;for(const m of N.matchAll(/[\s・·:]/g)){const i=m.index,L=[N.slice(0,i+(/\s/.test(N[i])?0:1)).trim(),N.slice(i+1).trim()];
    if(L[0]&&L[1]){const w=Math.max(tw(L[0],11),tw(L[1],11));if(!best||w<best.w)best={L,w}}}
  if(best&&(r=fit(best.L,7.5)))return r;
  const h=Math.ceil(N.length/2),lat=/[A-Za-z]$/.test(N.slice(0,h));
  if(lat&&(r=fit([N],9)))return r;// Latin words shrink a little; CJK names split instead
  return fit([N.slice(0,h)+(lat?'-':''),N.slice(h)],0)}
const PXB=3.2,TOPB=200,PAD_T=26,ICON=36,LABB=44,COL=56;
const YB=cm=>PAD_T+(TOPB-cm)*PXB, HB=PAD_T+TOPB*PXB+LABB;
function bars(){// like the lineup, the bars are cut into rows that fit the page width, stacked one under another
  const box=$('barRows');box.innerHTML='';const all=order();
  const per=Math.max(6,Math.floor(((box.clientWidth||innerWidth)-44-18-20)/COL)),rows=Math.ceil(all.length/per),n=Math.ceil(all.length/rows);
  for(let r=0;r<rows;r++)barRow(all.slice(r*n,(r+1)*n),r*n)}
function barRow(a,i0){const box=$('barRows'),w=document.createElement('div');w.className='wrap';
  w.innerHTML='<div class="yaxis"><svg width="44"></svg></div><div class="scroll"><svg class="plot"></svg></div>';box.appendChild(w);
  const ax=w.querySelector('.yaxis svg'),s=w.querySelector('.plot'),W=a.length*COL+16;ax.setAttribute('height',HB);
  for(let c=0;c<=TOPB;c+=10)el('text',{x:38,y:YB(c)+4,'text-anchor':'end','font-size':11,fill:css('--text-3')},ax).textContent=c+(c===TOPB?' cm':'');
  s.setAttribute('width',W);s.setAttribute('height',HB);
  for(let c=0;c<=TOPB;c+=10)el('line',{x1:0,x2:W,y1:YB(c),y2:YB(c),stroke:css(c===0?'--axis':'--grid'),'stroke-width':1},s);
  a.forEach((d,j)=>{const i=i0+j,cx=8+j*COL+COL/2,col=css(FC[d.frame]),g=el('g',{},s);
    const body=d.h,top=d.a||d.h;// solid bar to the top of the hair, dashed bar for a hat or ears above it
    const ex=el('g',{class:'ex'},g);// hat or ears, shown on hover
    if(top-body>=.5){el('path',{d:`M${cx-7},${YB(body)}V${YB(top)+4}q0,-4 4,-4h6q4,0 4,4V${YB(body)}Z`,fill:col,'fill-opacity':.12,stroke:col,'stroke-width':1.5,'stroke-dasharray':'3 3'},ex);
      el('text',{x:cx+10,y:YB(top)+9,'font-size':9.5,fill:css('--text-3')},ex).textContent='+'+(top-body).toFixed(0)}
    el('path',{d:`M${cx-7},${YB(0)}V${YB(body)+4}q0,-4 4,-4h6q4,0 4,4V${YB(0)}Z`,fill:col},g);
    const iy=YB(body)-ICON-4,ic=el('g',{class:'ic'},g);// icon sits on the solid bar and rises to the hat or ear top on hover
    el('circle',{cx,cy:iy+ICON/2,r:ICON/2+2,fill:css('--surface'),stroke:col,'stroke-width':2},ic);
    if(d.icon){el('clipPath',{id:'c'+i},ic).appendChild(el('circle',{cx,cy:iy+ICON/2,r:ICON/2}));
      el('image',{href:'img/'+d.code+'.png?v='+BUILD,x:cx-ICON/2,y:iy,width:ICON,height:ICON,'clip-path':`url(#c${i})`},ic)}
    else if(d.sil){const sp=SIL[d.sil],sc=(ICON-8)/400;const gg=el('g',{transform:`translate(${cx-sp.w*sc/2},${iy+4}) scale(${sc})`},ic);el('path',{d:sp.d,fill:css('--sil'),'fill-rule':'evenodd'},gg)}
    const num=el('text',{x:cx,y:iy-5,'text-anchor':'middle','font-size':11,'font-weight':600,fill:css('--text-1')},ic);num.textContent=body.toFixed(0);
    const L=nameLines(nm(d));L.lines.forEach((w,k)=>el('text',{x:cx,y:YB(0)+15+k*13,'text-anchor':'middle','font-size':L.fs,fill:css('--text-2')},g).textContent=w);
    el('rect',{x:cx-COL/2,y:0,width:COL,height:HB,fill:'transparent'},g);
    const up=YB(top)-YB(body);g.addEventListener('mouseenter',()=>{ic.style.transform=`translateY(${up}px)`;ex.style.opacity=1;num.textContent=top.toFixed(0)});
    g.addEventListener('mousemove',e=>tip(e,d));g.addEventListener('mouseleave',()=>{ic.style.transform='';ex.style.opacity=0;num.textContent=body.toFixed(0);hideTip()});
  })}

/* ---------- table ---------- */
let tk='h',td=-1;
function table(){const s=S(),val=(d,k)=>k==='name'?nm(d):d[k];const a=DD().sort((x,y)=>{const u=val(x,tk),v=val(y,tk);return (typeof u==='number'||u==null?((u??0)-(v??0)):String(u).localeCompare(String(v)))*td});
  const C=['name','h','a','frame','code'].map((k,i)=>[k,s.cols[i+1]]);
  const head=`<thead><tr><th>${s.cols[0]}</th>`+C.map(c=>`<th data-k="${c[0]}">${c[1]}${tk===c[0]?(td<0?' ▼':' ▲'):''}</th>`).join('')+'</tr></thead>';
  const row=(d,i)=>`<tr><td class="n">${i+1}</td><td>${d.icon?`<img src="img/${d.code}.png?v=${BUILD}" alt="">`:'<span class="ph"></span>'}${nm(d)}</td><td class="n">${d.h.toFixed(1)}</td><td class="n">${d.a?d.a.toFixed(1):''}</td><td>${s.fr[d.frame].replace(/s$/,'')}</td><td>${d.code}</td></tr>`;
  const k=Math.max(1,Math.floor(($('tbl').clientWidth||innerWidth)/700)),per=Math.ceil(a.length/k);// the list continues in side-by-side tables
  $('tbl').innerHTML=Array.from({length:k},(_,j)=>'<table>'+head+'<tbody>'+a.slice(j*per,(j+1)*per).map((d,i)=>row(d,j*per+i)).join('')+'</tbody></table>').join('');
  document.querySelectorAll('#tbl th[data-k]').forEach(th=>th.onclick=()=>{const k=th.dataset.k;td=tk===k?-td:(k==='name'||k==='frame'||k==='code'?1:-1);tk=k;table()})}

function render(){if(view==='lineup')lineup();if(view==='bars')bars()}
document.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{sort=b.dataset.sort;document.querySelectorAll('[data-sort]').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',x===b));
  for(const v of ['lineup','bars','table'])$(v+'View').classList.toggle('hidden',v!==view);view==='table'&&table();render()});
$('acc').onchange=e=>{acc=e.target.checked;bars()};
$('spo').checked=spoil;$('spo').onchange=e=>{spoil=e.target.checked;try{localStorage.setItem('gfl2h-spoil',spoil?'1':'0')}catch(x){}applyLang();render();table()};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{view==='lineup'&&lineup();view==='bars'&&bars();view==='table'&&table()},150)});
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;try{localStorage.setItem('gfl2h-lang',lang)}catch(e){}applyLang();render();table()});
applyLang();lineup();table();
</script>

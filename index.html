<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GFL2 Height Chart</title>
<meta name="description" content="Girls' Frontline 2 doll height chart. All 68 dolls and the Commander, measured from the game's 3D models.">
<meta property="og:type" content="website">
<meta property="og:title" content="GFL2 doll height chart">
<meta property="og:description" content="All 68 dolls and the Commander, measured from the game's 3D models. Add your own height and compare. English, 日本語, 한국어, 中文.">
<meta property="og:url" content="https://chessy795.github.io/gfl2-heights/">
<meta property="og:image" content="https://chessy795.github.io/gfl2-heights/og.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://chessy795.github.io/gfl2-heights/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--surface:#fcfcfb;--stage:#f1f0ec;--stage-2:#e6e5df;--panel:#ffffff;--text-1:#0b0b0b;--text-2:#52514e;--text-3:#7a7974;--grid:#dcdbd5;--grid-2:#c9c8c2;--axis:#c9c8c2;--floor:#b9b8b1;--glow:rgba(42,120,214,.10);
--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--sil:#3f4148;--you:#7b4fd6;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--surface:#1a1a19;--stage:#121316;--stage-2:#1b1d22;--panel:#24252a;--text-1:#f0efec;--text-2:#c3c2b7;--text-3:#8e8d86;--grid:#24262b;--grid-2:#33363d;--axis:#45453f;--floor:#5a5d66;--glow:rgba(57,135,229,.16);
--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--sil:#c9ccd6;--you:#a383f2;color-scheme:dark}}
:root[data-theme="dark"]{--surface:#1a1a19;--stage:#121316;--stage-2:#1b1d22;--panel:#24252a;--text-1:#f0efec;--text-2:#c3c2b7;--text-3:#8e8d86;--grid:#24262b;--grid-2:#33363d;--axis:#45453f;--floor:#5a5d66;--glow:rgba(57,135,229,.16);
--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--sil:#c9ccd6;--you:#a383f2;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--surface);color:var(--text-1);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{padding:24px 16px 40px}
.disp{font-family:Rajdhani,"Bahnschrift","Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:14px}
h1{font-size:34px;line-height:1;margin:0;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
h1 small{display:block;font-size:13px;letter-spacing:.24em;color:var(--text-3);font-weight:600;margin-bottom:6px}
.sub{color:var(--text-2);margin:8px 0 0;max-width:820px}
.how{color:var(--text-2);margin:6px 0 0;max-width:820px;font-size:14px}.how summary{cursor:pointer;color:var(--text-1);font-weight:600}.how p{margin:6px 0}
.bar{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--axis);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--text-2);padding:6px 12px;font:inherit;cursor:pointer}
.seg button+button{border-left:1px solid var(--axis)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--text-1);font-weight:600}
.hright{display:flex;align-items:flex-start;align-self:flex-start;gap:8px}.theme{border:1px solid var(--axis);border-radius:8px;background:transparent;color:var(--text-1);font-size:18px;padding:8px 13px;cursor:pointer}
.seg.lang{align-self:flex-start;flex-wrap:wrap}.seg.lang button{padding:10px 18px;font-size:16px;white-space:nowrap}
@media (max-width:600px){.seg.lang button{padding:8px 11px;font-size:14px}h1{font-size:28px}}
.tools{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
#q,#me{font:inherit;color:var(--text-1);background:var(--panel);border:1px solid var(--axis);border-radius:8px;padding:6px 10px}
#q{width:200px}#me{width:80px}label.me{display:inline-flex;gap:6px;align-items:center;color:var(--text-2)}
.seg.mini button{padding:6px 10px}
.btn{font:inherit;color:var(--text-1);background:transparent;border:1px solid var(--axis);border-radius:8px;padding:6px 12px;cursor:pointer}
.picks{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;color:var(--text-2);font-size:13px;margin-bottom:12px;min-height:28px}
.picks button{font:inherit;color:var(--text-1);background:var(--panel);border:1px solid var(--axis);border-radius:999px;padding:3px 10px;cursor:pointer}
.near{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;color:var(--text-2);font-size:13px;margin:-4px 0 12px}.near:empty{display:none}
.near button{font:inherit;color:var(--text-1);background:transparent;border:1px dashed var(--you);border-radius:999px;padding:3px 10px;cursor:pointer}
.picks button.sv{border-color:var(--you)}
.picks button.clr{background:transparent;color:var(--text-2)}
.none{color:var(--text-2);padding:40px 0}
#tbl tbody tr{cursor:pointer}#tbl tr.pk td{background:var(--glow)}
.lab.pk b{color:var(--you)}
#cmpBox .stage{outline:2px solid var(--you);outline-offset:-2px;margin-bottom:14px}
.eView{position:relative;overflow:hidden;background:var(--stage);border-radius:12px;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.eView.grab{cursor:grabbing}.eView img{-webkit-user-drag:none}
.eStage{position:absolute;left:0;top:0;transform-origin:0 0}.eStage.smooth{transition:transform .6s cubic-bezier(.3,.7,.2,1)}.eStage>img,.eStage svg{position:absolute}
.ep{position:absolute;z-index:2;cursor:pointer;transition:transform .25s ease;touch-action:none}.eStage:not(.zoomed) .ep:hover{transform:scale(4);z-index:5}
.eBar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:0 0 10px}.eBar .seg button{min-width:38px}
.stk{display:inline-flex;gap:6px;align-items:center;color:var(--text-2)}.stk select{font:inherit;color:var(--text-1);background:var(--surface);border:1px solid var(--axis);border-radius:8px;padding:5px 8px;max-width:210px}
.eStk{margin:0 0 10px;color:var(--text-1);font-weight:600}.eStk:empty{display:none}
.eTags{position:absolute;inset:0;pointer-events:none;overflow:hidden}.eTag{position:absolute;transform:translate(-50%,calc(-100% - 10px));background:var(--surface);border:1px solid var(--you);border-radius:8px;padding:4px 10px;font-size:13px;white-space:nowrap;color:var(--text-1);box-shadow:0 2px 10px #0004;animation:tagin .25s ease .45s both}
@keyframes tagin{from{opacity:0;transform:translate(-50%,calc(-100% - 2px))}}
.eHint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000b;color:#fff;padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}.eHint.on{opacity:1}
.pzt{position:absolute;overflow:hidden;pointer-events:none;z-index:401}.pzt img{position:absolute;left:0;animation:drop .4s cubic-bezier(.3,1.5,.5,1) both}
.eStack{position:absolute;overflow:hidden;pointer-events:none;z-index:1}.eStack>div{position:absolute;animation:drop .4s cubic-bezier(.3,1.5,.5,1) both}
.eTop{position:absolute;height:0;border-top:2px dashed var(--you);pointer-events:none;z-index:3}.eTop span{position:absolute;left:4px;top:-20px;font-size:12px;color:var(--text-2);white-space:nowrap}
.smoke{position:absolute;border-radius:50%;background:var(--text-3);opacity:0;animation:smoke 3.3s ease-out infinite;pointer-events:none}
@keyframes smoke{0%{opacity:.35;transform:translate(0,0) scale(.4)}100%{opacity:0;transform:translate(-60px,-90px) scale(2.4)}}
.anim .elmo{animation:roll 1.7s cubic-bezier(.2,.75,.25,1) both,rumble .09s linear 1.7s 8 alternate}
@keyframes roll{from{transform:translateX(110%)}to{transform:none}}@keyframes rumble{to{transform:translateY(1.5px)}}
.anim .ep{animation:drop .45s cubic-bezier(.3,1.5,.5,1) both}@keyframes drop{from{opacity:0;transform:translateY(-40px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.eStage,.eStage *,.eTag{animation:none!important;transition:none!important}.smoke{display:none}}.eGround{position:absolute;left:0;right:0;height:2px;background:var(--floor)}
.eLab{position:absolute;font-size:12px;color:var(--text-2);white-space:nowrap;transform:translateX(-50%)}
label.chk{display:inline-flex;gap:6px;align-items:center;color:var(--text-2);cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--text-2);font-size:13px;margin-bottom:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.hidden{display:none!important}
/* lineup */
.stage{position:relative;border-radius:12px;overflow:hidden;background:radial-gradient(120% 80% at 50% 0%,var(--glow),transparent 60%),linear-gradient(var(--stage),var(--stage-2));border:1px solid var(--grid)}
.lscroll{overflow-x:auto;overflow-y:hidden;position:relative}
.lscroll::-webkit-scrollbar{height:10px}.lscroll::-webkit-scrollbar-thumb{background:var(--grid-2);border-radius:5px}
.track{position:relative}
.stage+.stage{margin-top:14px}
.gl{position:absolute;left:0;right:0;height:1px;background:var(--grid)}
.gl.major{background:var(--grid-2)}
.floor{position:absolute;left:0;right:0;height:2px;background:var(--floor)}
.floorfade{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--stage-2) 30%)}
.ruler{position:absolute;left:0;top:0;bottom:0;width:58px;pointer-events:none;z-index:500;background:linear-gradient(90deg,var(--stage) 55%,transparent)}
.ruler div{position:absolute;left:8px;font:600 12px/1 Rajdhani,"Bahnschrift",sans-serif;color:var(--text-3);transform:translateY(-50%);letter-spacing:.04em}
.fig{position:absolute;overflow:hidden;pointer-events:none;transition:opacity .2s,filter .2s;
 -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent),linear-gradient(#000 calc(100% - 12px),transparent);-webkit-mask-composite:source-in;
 mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent),linear-gradient(#000 calc(100% - 12px),transparent);mask-composite:intersect}
.fig.full{-webkit-mask-image:linear-gradient(#000 calc(100% - 12px),transparent);mask-image:linear-gradient(#000 calc(100% - 12px),transparent)}
.fig img,.fig svg.s{position:absolute;top:0;display:block;user-select:none}
.shd{position:absolute;height:16px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.5),transparent);transform:translate(-50%,-50%);z-index:5;pointer-events:none}
.hit{position:absolute;cursor:pointer;z-index:450}
.dim .fig{opacity:.2;filter:saturate(.25)}
.dim .fig.on{opacity:1;filter:none}
.lab{position:absolute;z-index:460;text-align:center;transform:translateX(-50%);white-space:nowrap;pointer-events:none}
.lab b{display:block;font:700 17px/1 Rajdhani,"Bahnschrift",sans-serif;color:var(--text-1);letter-spacing:.02em}
.lab span{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--text-2);margin-top:3px}
.lab i{width:7px;height:7px;border-radius:2px;display:inline-block}
.dim .lab{opacity:.35}.dim .lab.on{opacity:1}
.hip{position:absolute;height:0;border-top:2px dashed var(--text-2);z-index:420;pointer-events:none}
.hip span{position:absolute;left:66px;top:-24px;font:700 13px/1 Rajdhani,"Bahnschrift",sans-serif;color:var(--text-1);background:var(--panel);border:1px solid var(--axis);border-radius:6px;padding:3px 7px;white-space:nowrap}
.hip.each span{left:50%;transform:translateX(-50%);font-size:12px}
.fnote+#frameBox,#frameBox{display:flex;flex-wrap:wrap;gap:0 16px;align-items:flex-start}.fgroup{max-width:100%;min-width:0}.fgroup .stage{max-width:100%}
.fhead{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin:22px 0 8px}.fgroup .fhead{margin-top:18px}
.fhead i{width:12px;height:12px;border-radius:3px;align-self:center}.fhead b{font-size:18px}.fhead span{color:var(--text-2)}
.fnote{color:var(--text-2);margin:0 0 6px;max-width:900px}
#bustView{--milk:#fffdf6;--milkedge:#cfc4a6}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px}
.bcard{position:relative;background:var(--panel);border:1px solid var(--grid-2);border-radius:12px;padding:8px 6px 10px;text-align:center;cursor:pointer;font:inherit;color:var(--text-1)}
.bcard[aria-pressed=true]{border-color:var(--you);box-shadow:0 0 0 1px var(--you)}
.bcard .row{display:flex;align-items:flex-end;justify-content:center;gap:4px;min-height:114px}.bcard .fr{line-height:.85}
.bcard .rk{position:absolute;top:6px;right:8px;color:var(--text-3);font-size:12px}
.bnm{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px}.bnm img{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:none;background:var(--stage-2)}
.bnm b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bv{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}.bm{color:var(--text-2);font-size:12.5px}
.bcmp{display:flex;flex-wrap:wrap;gap:18px 30px;align-items:flex-end;justify-content:center;padding:16px 12px 12px;margin:8px 0 6px;background:var(--stage);border-radius:12px}.bcmp:empty{display:none}
.hht{margin:28px 0 4px}.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px}.hgrid figure{margin:0;background:#ecebe6;border-radius:10px;padding:6px 4px 8px;text-align:center;color:#1d1d1f}.hgrid img{width:100%;height:auto;display:block}.hgrid figcaption{font-size:13px;line-height:1.35;margin-top:4px}.hgrid figcaption b,.hgrid figcaption span{display:block}.hgrid .ha{color:#b4382c}
.bfig{text-align:center;margin:0}.bfig .row{display:flex;align-items:flex-end;gap:6px;justify-content:center}.bfig .fr{line-height:.85}
.bfig figcaption{font-weight:700;margin-top:6px}.bfig .bm{font-weight:400}
.hline{position:absolute;left:0;right:0;height:0;border-top:1.5px dashed var(--text-2);pointer-events:none;z-index:600;display:none}
.hline span{position:absolute;left:66px;top:-22px;font:700 14px/1 Rajdhani,"Bahnschrift",sans-serif;color:var(--text-1);background:var(--panel);border:1px solid var(--axis);border-radius:6px;padding:3px 7px}
/* bars */
.wrap{display:flex;border:1px solid var(--grid);border-radius:12px;background:var(--surface)}
.wrap+.wrap{margin-top:14px}
.bkey{display:flex;align-items:center;gap:6px;color:var(--text-2);font-size:13px;margin:0 0 10px}.bkey i{width:10px;height:16px;border-radius:3px 3px 0 0;display:inline-block}
.bkey .sb{background:var(--text-3)}.bkey .db{border:1.5px dashed var(--text-3);border-bottom:0;margin-right:4px}
.yaxis{flex:0 0 44px}
.scroll{overflow-x:auto;flex:1}
svg text{font-family:inherit}
.plot .ic{transition:transform .35s cubic-bezier(.3,1.4,.5,1)}.plot .ex{opacity:0;transition:opacity .25s}
/* table */
#tbl{display:flex;gap:28px;align-items:flex-start}
#tbl table{flex:1}
table{border-collapse:collapse;margin-top:4px;font-size:13px}
th,td{padding:5px 8px;text-align:left;border-bottom:1px solid var(--grid)}
th{color:var(--text-2);font-weight:600;cursor:pointer;user-select:none}
td.n{text-align:right;font-variant-numeric:tabular-nums}
td img,td .ph{width:24px;height:24px;border-radius:50%;vertical-align:middle;margin-right:8px;display:inline-block;background:var(--grid)}
.tip{position:fixed;pointer-events:none;background:var(--panel);color:var(--text-1);border:1px solid var(--axis);border-radius:8px;padding:8px 10px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.22);display:none;z-index:9999;max-width:270px}
.tip b{display:block;font:700 17px/1.1 Rajdhani,"Bahnschrift",sans-serif;margin-bottom:3px}
.tip .m{color:var(--text-2)}
.foot{color:var(--text-3);font-size:12px;margin:22px 0 0;max-width:900px}
.notes{color:var(--text-2);font-size:13px;max-width:900px;margin-top:20px;padding-left:18px}
.notes li{margin:4px 0}
.est{display:inline-block;margin-top:4px;padding-top:4px;border-top:1px dashed var(--grid);color:var(--text-3);font-style:italic}
.tps{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;margin:8px 0 18px}
.tps figure{margin:0;text-align:center}.tps figcaption{font-weight:700;margin-top:4px}
.howtxt{max-width:760px;margin:0 auto}.howtxt p{line-height:1.6;color:var(--text-2)}.howtxt b{color:var(--text-1)}
</style>
</head>
<body>
<main>
<header>
  <div>
    <h1 class="disp"><small data-t="game"></small><span data-t="title"></span></h1>
    <p class="sub" data-t="sub"></p>
  </div>
  <div class="hright">
  <div class="seg lang" role="group" aria-label="Language">
    <button data-lang="en">English</button><button data-lang="ja">日本語</button><button data-lang="ko">한국어</button><button data-lang="zh">简体中文</button><button data-lang="zht">繁體中文</button>
  </div>
  <button class="theme" id="theme" aria-label="Light or dark"></button>
  </div>
</header>
<div class="bar">
  <div class="seg" role="group" aria-label="View">
    <button data-view="lineup" aria-pressed="true" data-t="lineup"></button>
    <button data-view="bars" data-t="bars"></button>
    <button data-view="table" data-t="table"></button>
    <button data-view="frames" data-t="frames"></button>
    <button data-view="elmo" data-t="elmo"></button>
    <button data-view="bust" data-t="bustTab"></button>
    <button data-view="howv" data-t="howTab"></button>
  </div>
  <div class="seg" role="group" aria-label="Sort" id="sortSeg">
    <button data-sort="h" aria-pressed="true" data-t="byh"></button>
    <button data-sort="frame" data-t="byf"></button>
    <button data-sort="name" data-t="byn"></button>
  </div>
  <label class="chk"><input type="checkbox" id="spo"> <span data-t="spo"></span></label>
  <label class="chk"><input type="checkbox" id="ext"> <span data-t="ext"></span></label>
  <label class="chk"><input type="checkbox" id="ene"> <span data-t="ene"></span></label>
  <label class="chk" id="pzl"><input type="checkbox" id="pz"> 🍕 <span data-t="pzt"></span></label>
  <label class="chk hidden" id="accl"><input type="checkbox" id="acc"> <span data-t="acc"></span></label>
  <div class="tools">
    <input type="search" id="q" autocomplete="off" aria-label="Search">
    <label class="me"><span data-t="youh"></span><input type="text" id="me" inputmode="decimal" autocomplete="off"></label>
    <div class="seg mini" id="unit" role="group" aria-label="Unit"><button data-u="cm">cm</button><button data-u="ft">ft/in</button></div>
    <button class="btn" id="share" data-t="copy"></button>
  </div>
</div>
<div class="legend" id="legend"></div>
<div class="picks" id="picks"></div>
<div class="near" id="near"></div>
<section id="lineupView">
  <div id="cmpBox"></div>
  <div id="stages"></div>
</section>
<section id="howvView" class="hidden">
  <p class="fnote" id="howLead"></p>
  <div id="howBox"></div>
  <h3 class="hht" data-t="headsT"></h3>
  <p class="fnote" data-t="headsLead"></p>
  <div class="hgrid" id="howHeads"></div>
  <div class="howtxt" id="howTxt" style="margin-top:28px"></div>
</section>
<section id="framesView" class="hidden">
  <p class="fnote" data-t="fkey"></p>
  <div id="frameBox"></div>
</section>
<section id="elmoView" class="hidden">
  <p class="fnote" id="ecap"></p>
  <div id="elmoBox"></div>
  <p class="fnote" id="elr"></p>
</section>
<section id="bustView" class="hidden">
  <p class="fnote" data-t="bustLead"></p>
  <div class="bcmp" id="bustCmp"></div>
  <div class="bgrid" id="bustGrid"></div>
</section>
<section id="barsView" class="hidden">
  <p class="bkey"><i class="sb"></i><i class="db"></i><span data-t="key"></span></p>
  <div id="barRows"></div>
</section>
<section id="tableView" class="hidden"><div id="tbl"></div></section>
<p class="foot" data-t="foot"></p>
<div class="tip" id="tip"></div>

const HOW={"en": {"howT": "How the heights are measured", "howP": ["Every number comes from the doll’s 3D model in the game files, at the game’s own scale (1 unit = 1 m). Nothing is estimated from the art.", "<b>Height</b> runs from the floor to the highest point of the hair, standing in the model’s default pose, with shoes on. Hats, ears and headpieces that sit above the hair are shown separately as a dashed line, so they don’t count toward the height. Each doll is measured in her <b>dorm model</b>, the one in her dorm room, so her shoes and hair are her dorm outfit’s. Those can differ from the art shown here. Her battle and Crew Deck model was checked too and comes out within about 1 cm (Liushih’s sits on her horse there). In the dorm everyone wears heeled sandals, but the heel is not the same for everyone. It lifts her 2.4–3.6 cm depending on body frame, 4.4 cm for Ullrid and 5.3 cm for Voymastina. The height includes the sandals, so up to about 3 cm of the gap between two dolls can be the shoes. <b>Barefoot</b> height (grey, an estimate) takes the sandal’s lift off, so it compares the dolls themselves.", "Heights are read from the model’s actual vertices (the points its surface is built from), not from the size boxes the game stores for each part, which read 1–3 cm tall. Ears, buns and tufts that stick up 2 cm or more above the top of the head count as extras, so they get the dashed line too.", "<b>Leg length</b> runs from the floor to the skeleton’s hip joint. Dolls with the same body frame share one skeleton, so their legs are exactly the same.", "<b>Shoe size</b> is an estimate from the barefoot height, using a real foot of about 14.7% of height, the average for Japanese women (158 cm tall, 23.2 cm foot). EU ≈ 1.5 × (foot + 1.5 cm), and JP is the foot length in cm. The models’ own feet are much smaller than real ones, as usual for anime models, so they aren’t used. Shoe size and barefoot height are the only estimates on the page, not measurements, so they are shown in grey with ≈.", "Spotted something that looks wrong? Tell me and I’ll check it against the model."], "feet": "Foot", "shoe": "Shoe size (estimate from barefoot height)", "mfoot": "Foot (model)", "howTab": "How it's measured", "howLead": "These are the dolls’ actual 3D models from the game files, seen straight on in the pose they are stored in. Each line is one of the numbers on this page.", "floor": "Floor"}, "ja": {"howT": "身長の測り方", "howP": ["数値はすべてゲームファイル内の人形の3Dモデルから、ゲーム本来の縮尺（1単位＝1 m）で取っています。イラストからの推定はしていません。", "<b>身長</b>は床から髪のいちばん高い点まで。モデルの標準ポーズで立ち、靴を履いた状態です。髪より上にある帽子・耳・頭飾りは点線で別に示し、身長には含めません。測っているのは各人形の<b>宿舎モデル</b>（宿舎で見られる姿）なので、靴や髪は宿舎の服装のものです。ここに表示しているイラストとは違うことがあります。戦闘・クルーデッキのモデルも測り、差は1 cm程度以内でした（劉蒔はそちらでは馬に乗っています）。宿舎では全員ヒールのあるサンダルを履いていますが、ヒールの高さは全員同じではありません。かかとが持ち上がる高さは体格ごとに2.4〜3.6 cm、ウルリドは4.4 cm、ヴォイマスティナは5.3 cmです。身長はサンダル込みなので、二人の差のうち最大3 cmほどは靴の差のことがあります。<b>裸足</b>の身長（灰色、推定）はサンダルの分を引いたもので、人形そのものを比べられます。", "身長はモデルの実際の頂点（表面を作る点）から測っています。ゲームが各パーツに持つサイズの箱は1〜3 cm高めに出るため使っていません。頭頂より2 cm以上突き出た耳・お団子・アホ毛は別扱いで、点線で示します。", "<b>脚の長さ</b>は床から骨格の股関節まで。同じ骨格の人形はスケルトンを共有しているため、脚の長さはまったく同じです。", "<b>靴のサイズ</b>は裸足の身長からの推定です。実際の足の長さは身長の約14.7%とします。日本人女性の平均（身長158 cm、足23.2 cm）です。EU ≈ 1.5 ×（足＋1.5 cm）、JPは足の長さのcm。モデル自体の足はアニメ調らしく実際よりずっと小さいので使っていません。ページの中で靴のサイズと裸足の身長だけは測定値ではなく推定値なので、≈を付けて灰色で示しています。", "おかしな値を見つけたら教えてください。モデルで確認します。"], "feet": "足", "shoe": "靴のサイズ（裸足の身長からの推定）", "mfoot": "足（モデル）", "howTab": "測り方", "howLead": "ゲームファイル内の人形の3Dモデルそのものを、保存されているポーズのまま正面から見たものです。線はそれぞれ、このページの数値を示しています。", "floor": "床"}, "ko": {"howT": "키를 재는 방법", "howP": ["모든 수치는 게임 파일 속 인형의 3D 모델에서 게임 원래 축척(1단위 = 1 m)으로 가져왔습니다. 일러스트로 추정한 값은 없습니다.", "<b>키</b>는 바닥부터 머리카락의 가장 높은 점까지이며, 모델의 기본 자세로 서서 신발을 신은 상태입니다. 머리카락 위에 있는 모자·귀·머리 장식은 점선으로 따로 보여 주며 키에 넣지 않습니다. 재는 모델은 각 인형의 <b>숙소 모델</b>(숙소에서 보이는 모습)이라서, 신발과 머리는 숙소 복장 기준입니다. 여기 보이는 일러스트와 다를 수 있습니다. 전투·크루 데크 모델도 재 봤고 차이는 1 cm 정도 이내였습니다(류시는 그쪽에서 말을 타고 있습니다). 숙소에서는 모두 굽 있는 샌들을 신지만, 굽 높이는 모두 같지 않습니다. 뒤꿈치가 들리는 높이는 체격별로 2.4~3.6 cm, 울리드는 4.4 cm, 보이마스티나는 5.3 cm입니다. 키는 샌들을 포함하므로, 두 인형의 차이 중 최대 3 cm 정도는 신발 차이일 수 있습니다. <b>맨발</b> 키(회색, 추정)는 샌들만큼을 뺀 값이라 인형 자체를 비교할 수 있습니다.", "키는 모델의 실제 꼭짓점(표면을 이루는 점)에서 쟀습니다. 게임이 각 부분에 저장한 크기 상자는 1~3 cm 크게 나오므로 쓰지 않았습니다. 정수리보다 2 cm 이상 솟은 귀·번 머리·바보털은 따로 점선으로 보여 줍니다.", "<b>다리 길이</b>는 바닥부터 골격의 고관절까지입니다. 같은 골격의 인형은 스켈레톤을 공유하므로 다리 길이가 완전히 같습니다.", "<b>신발 사이즈</b>는 맨발 키로 추정한 값입니다. 실제 발 길이는 키의 약 14.7%로 잡았습니다. 일본 여성의 평균(키 158 cm, 발 23.2 cm)입니다. EU ≈ 1.5 × (발 + 1.5 cm), JP는 발 길이 cm입니다. 모델의 발은 애니메이션풍답게 실제보다 훨씬 작아서 쓰지 않았습니다. 페이지에서 신발 사이즈와 맨발 키만 측정값이 아닌 추정값이라 ≈를 붙여 회색으로 보여 줍니다.", "이상한 값을 발견하면 알려 주세요. 모델로 확인하겠습니다."], "feet": "발", "shoe": "신발 사이즈(맨발 키로 추정)", "mfoot": "발(모델)", "howTab": "측정 방법", "howLead": "게임 파일 속 인형의 실제 3D 모델을 저장된 자세 그대로 정면에서 본 모습입니다. 각 선이 이 페이지의 수치 하나입니다.", "floor": "바닥"}, "zh": {"howT": "身高是怎么测的", "howP": ["所有数值都取自游戏文件中人形的3D模型，按游戏本身的比例（1单位 = 1 m）。没有任何数值是从立绘估算的。", "<b>身高</b>从地面量到头发的最高点，模型以默认姿势站立，穿鞋。头发上方的帽子、耳朵和头饰用虚线单独标出，不计入身高。测量用的是每位人形的<b>宿舍模型</b>（宿舍里看到的样子），所以鞋子和头发都是宿舍服装的，可能和这里显示的立绘不同。战斗和船员甲板的模型也量过，相差约1 cm以内（刘莳在那里骑着马）。宿舍里大家都穿带跟的凉鞋，但鞋跟高度并不一样：按体型把脚跟垫高2.4–3.6 cm，乌尔丽德为4.4 cm，威玛希娜为5.3 cm。身高包含凉鞋，所以两位人形之间最多约3 cm的差距可能来自鞋子。<b>赤脚</b>身高（灰色，估算）减去凉鞋垫高的部分，比较的是人形本身。", "身高取自模型的实际顶点（构成表面的点），不用游戏为每个部件存储的尺寸框，因为那会偏高1–3 cm。高出头顶2 cm以上的耳朵、发髻和呆毛另算，也用虚线标出。", "<b>腿长</b>从地面量到骨骼的髋关节。同一骨架的人形共用一套骨骼，所以腿长完全相同。", "<b>鞋码</b>由赤脚身高估算：真人的脚长按身高的约14.7%计算，即日本女性的平均值（身高158 cm，脚长23.2 cm）。EU ≈ 1.5 ×（脚长 + 1.5 cm），JP即脚长的厘米数。模型自己的脚和多数动画风模型一样比真人小得多，所以不采用。鞋码和赤脚身高是页面上仅有的估算值而非测量值，所以加上≈并以灰色显示。", "发现哪里不对？告诉我，我会用模型核对。"], "feet": "脚长", "shoe": "鞋码（按赤脚身高估算）", "mfoot": "脚长（模型）", "howTab": "测量方法", "howLead": "这是游戏文件中人形的实际3D模型，以其存储时的姿势从正面观看。每条线对应本页的一个数值。", "floor": "地面"}, "zht": {"howT": "身高是怎麼測的", "howP": ["所有數值都取自遊戲檔案中人形的3D模型，按遊戲本身的比例（1單位 = 1 m）。沒有任何數值是從立繪估算的。", "<b>身高</b>從地面量到頭髮的最高點，模型以預設姿勢站立，穿鞋。頭髮上方的帽子、耳朵和頭飾用虛線單獨標出，不計入身高。測量用的是每位人形的<b>宿舍模型</b>（宿舍裡看到的樣子），所以鞋子和頭髮都是宿舍服裝的，可能和這裡顯示的立繪不同。戰鬥和船員甲板的模型也量過，相差約1 cm以內（劉蒔在那裡騎著馬）。宿舍裡大家都穿帶跟的涼鞋，但鞋跟高度並不一樣：按體型把腳跟墊高2.4–3.6 cm，烏爾麗德為4.4 cm，威瑪希娜為5.3 cm。身高包含涼鞋，所以兩位人形之間最多約3 cm的差距可能來自鞋子。<b>赤腳</b>身高（灰色，估算）減去涼鞋墊高的部分，比較的是人形本身。", "身高取自模型的實際頂點（構成表面的點），不用遊戲為每個部件儲存的尺寸框，因為那會偏高1–3 cm。高出頭頂2 cm以上的耳朵、髮髻和呆毛另算，也用虛線標出。", "<b>腿長</b>從地面量到骨骼的髖關節。同一骨架的人形共用一套骨骼，所以腿長完全相同。", "<b>鞋碼</b>由赤腳身高估算：真人的腳長按身高的約14.7%計算，即日本女性的平均值（身高158 cm，腳長23.2 cm）。EU ≈ 1.5 ×（腳長 + 1.5 cm），JP即腳長的公分數。模型自己的腳和多數動畫風模型一樣比真人小得多，所以不採用。鞋碼和赤腳身高是頁面上僅有的估算值而非測量值，所以加上≈並以灰色顯示。", "發現哪裡不對？告訴我，我會用模型核對。"], "feet": "腳長", "shoe": "鞋碼（按赤腳身高估算）", "mfoot": "腳長（模型）", "howTab": "測量方法", "howLead": "這是遊戲檔案中人形的實際3D模型，以其儲存時的姿勢從正面觀看。每條線對應本頁的一個數值。", "floor": "地面"}};for(const k in HOW)Object.assign(STR[k],HOW[k]);

document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{setView(b.dataset.view);view==='table'&&table();render();hashOut()});
/* ---------- pick and compare, search, you, link ---------- */
function toggle(d){if(!d)return;pick=pick.includes(d.code)?pick.filter(c=>c!==d.code):[...pick,d.code];update()}
function update(){picks();render();table();hashOut()}
function picks(){const p=$('picks'),s=S(),a=pick.map(c=>D.find(d=>d.code===c)).filter(d=>d&&(spoil||!d.cn));
  p.innerHTML=a.length?`<b>${s.cmp}</b>`+a.map(d=>`<button data-c="${d.code}">${nm(d)} ×</button>`).join('')+`<button class="sv">${s.save}</button><button class="clr">${s.clr}</button>`:`<span>${s.hint}</span>`;
  p.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{pick=pick.filter(c=>c!==b.dataset.c);update()});const c=p.querySelector('.clr');if(c)c.onclick=()=>{pick=[];update()};const v=p.querySelector('.sv');if(v)v.onclick=saveImg}
// the link keeps the view, sort, spoiler switch and picked dolls; language follows each reader's device
function hashOut(){const h=new URLSearchParams();if(view!=='lineup')h.set('v',view);if(sort!=='h')h.set('o',sort);if(spoil)h.set('s','1');if(!ext)h.set('x','0');if(ene)h.set('e','1');if(pick.length)h.set('c',pick.join('.'));
  const u=h.toString();history.replaceState(null,'',u?'#'+u:location.pathname+location.search)}
(()=>{const h=new URLSearchParams(location.hash.slice(1));if(['bars','table','frames','elmo','howv','bust'].includes(h.get('v')))setView(h.get('v'));if(['frame','name'].includes(h.get('o')))setSort(h.get('o'));
  if(h.get('s')==='1')spoil=true;if(h.get('x')==='0')ext=false;if(h.get('e')==='1')ene=true;if(h.get('c'))pick=h.get('c').split('.').filter(c=>D.some(d=>d.code===c));if(STR[h.get('l')])lang=h.get('l')})();
$('q').oninput=e=>{q=e.target.value.trim();render();table()};
const meShow=()=>{$('me').value=me?(unit==='ft'?ftin(me):me):'';$('me').placeholder=unit==='ft'?`5'4"`:'163';document.querySelectorAll('[data-u]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.u===unit))};meShow();
document.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{unit=b.dataset.u;try{localStorage.setItem('gfl2h-unit',unit)}catch(e){}meShow();render();table()});
$('me').oninput=e=>{me=parseH(e.target.value);try{me?localStorage.setItem('gfl2h-me',me):localStorage.removeItem('gfl2h-me')}catch(x){}render()};
$('share').onclick=()=>{hashOut();const done=()=>{$('share').textContent=S().copied;setTimeout(()=>$('share').textContent=S().copy,1600)};
  navigator.clipboard?navigator.clipboard.writeText(location.href).then(done,()=>prompt('',location.href)):prompt('',location.href)};
$('acc').onchange=e=>{acc=e.target.checked;bars()};
$('pzl').hidden=!PZ;$('pz').checked=pzOn;$('pz').onchange=e=>{pzOn=e.target.checked;try{localStorage.setItem('gfl2h-pz',pzOn?'1':'0')}catch(x){}};
$('ene').checked=ene;$('ene').onchange=e=>{ene=e.target.checked;try{localStorage.setItem('gfl2h-ene',ene?'1':'0')}catch(x){}applyLang();render();table();hashOut()};$('ext').checked=ext;$('ext').onchange=e=>{ext=e.target.checked;try{localStorage.setItem('gfl2h-ext',ext?'1':'0')}catch(x){}applyLang();render();table();hashOut()};
$('spo').checked=spoil;$('spo').onchange=e=>{spoil=e.target.checked;try{localStorage.setItem('gfl2h-spoil',spoil?'1':'0')}catch(x){}applyLang();render();table();hashOut()};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{setTheme();render();table()});
// light or dark: follows the device until the button picks one, then remembers it
let theme=(()=>{try{return localStorage.getItem('gfl2h-theme')}catch(e){return null}})();
const isDark=()=>theme?theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
function setTheme(){if(theme)document.documentElement.dataset.theme=theme;else delete document.documentElement.dataset.theme;$('theme').textContent=isDark()?'☀':'☾'}
$('theme').onclick=()=>{theme=isDark()?'light':'dark';try{localStorage.setItem('gfl2h-theme',theme)}catch(e){}setTheme();render();table()};
setTheme();render();
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{view==='lineup'&&(cmp(),lineup());view==='bars'&&bars();view==='frames'&&frames();view==='elmo'&&elmo();view==='table'&&table()},150)});
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;try{localStorage.setItem('gfl2h-lang',lang)}catch(e){}applyLang();render();table()});
applyLang();lineup();table();
</script>
